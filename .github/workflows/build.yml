name: Bouw Kijkdoos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Web-app (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: kijkdoos-windows
          path: dist/*.exe

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Http-streams toestaan en icoon zetten
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=android/app/src/main/res/mipmap-${d%%:*}; size=${d##*:}
            mkdir -p $dir
            convert build/icon.png -resize ${size}x${size} $dir/ic_launcher.png
            convert build/icon.png -resize ${size}x${size} $dir/ic_launcher_round.png
            convert build/icon.png -resize ${size}x${size} $dir/ic_launcher_foreground.png
          done
      - run: npx cap sync android
      - name: APK bouwen
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Kijkdoos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kijkdoos-android
          path: Kijkdoos.apk

  release:
    name: Downloads publiceren
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kijkdoos (nieuwste build)
          prerelease: false
          make_latest: true
          body: |
            **Android:** download `Kijkdoos.apk` op je telefoon en installeer (sta "onbekende bronnen" toe).
            **Windows:** `Kijkdoos-Setup-*.exe` (installer) of `Kijkdoos-Portable-*.exe` (zonder installatie).
            **Web:** https://endless1977.github.io/IpTv/
          files: out/*
